name: Build
on:
  workflow_call: { }

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare/linux
      - name: Build
        run: |
          git config --global safe.directory "*"

          bash .github/workflows/build.sh

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare/msys2
      - name: Build
        run: |
          bash .github/workflows/build.sh
